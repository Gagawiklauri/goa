<!-- value - განსაზღვრავს რა მნიშვნელობა გაიგზავნება სერვერზე -->

<!-- selected - აყენებს default წინასწარ მონიშნულ ვარიანტს -->

<!-- disabled - ხდის option-ს მიუწვდომელს ვერ აირჩევ -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Color Select</title>
</head>
<body>

    <label>Select a color:</label>

    <select name="colors">
        <option value="red">Red</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
    </select>

</body>
</html>

<!-- src - მიუთითებს ვიდეოს ფაილის მისამართს -->

<!-- controls - ამატებს ვიდეოს მართვის ღილაკებს play, pause, volume და ა.შ. -->

<!-- autoplay - ვიდეო ავტომატურად იწყებს გაშვებას გვერდის გახსნისას -->

<!-- loop - ვიდეო თავიდან იწყებს გაშვებას დასრულების შემდეგ -->

<!-- muted - ვიდეო იწყება ჩუმად ხმის გარეშე -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My First Video</title>
</head>
<body>

    <h2>My First Video</h2>

    <video src="https://www.youtube.com/watch?v=I3axSEswT6A" controls></video>

</body>
</html>

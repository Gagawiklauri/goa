<!-- id ატრიბუტი: უნიკალური იდენტიფიკატორი (ერთ გვერდზე მხოლოდ ერთხელ უნდა გამოიყენო) -->
<p id="text1">ეს არის ტექსტი</p>

<!-- class ატრიბუტი: ერთსა და იმავე სტილს/ჯგუფს აძლევს რამდენიმე ელემენტს -->
<p class="note">ეს არის შენიშვნა</p>

<!-- style ატრიბუტი: ელემენტის პირდაპირი გაფორმება (CSS inline) -->
<p style="color: red; font-size: 20px;">წითელი ტექსტი</p>

<!-- title ატრიბუტი: მაუსის მიტანისას აჩვენებს მინიშნებას -->
<p title="ეს არის მინიშნება">მაუსი გადაუსვი აქ</p>

<!-- href ატრიბუტი: ბმულის მისამართი -->
<a href="https://example.com">გადადით საიტზე</a>



<!-- src ატრიბუტი: სურათის წყარო (მისამართი) -->
<img src="image.jpg" alt="სურათის აღწერა">



<!-- width და height: ზომების განსაზღვრა -->
<img src="image.jpg" width="300" height="200">


<!-- placeholder ატრიბუტი: მინიშნების ტექსტი ველში -->
<input type="text" placeholder="შეიყვანე სახელი">

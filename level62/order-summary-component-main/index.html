<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Order summary card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 
  Order Summary

  You can now listen to millions of songs, audiobooks, and podcasts on any 
  device anywhere you like!

  Annual Plan
  $59.99/year

  Change

  Proceed to Payment
  Cancel Order -->
  <div id="main">
    <div id="top">
      <img src="./images/illustration-hero.svg" id="first">
    </div>
    <div id="boto">
      <h1>Order Summary</h1>
      <p id="bluer">  You can now listen to millions of songs, <br> audiobooks, and podcasts on any 
  device <br> anywhere you like!</p>
    </div>

    <div id="buy">
      <img src="./images/icon-music.svg" alt="">
      <p>  Annual Plan <br> $59.99/year</p>
    </div>
    <div id="flosti">
      <p id="wh">Proceed to Payment</p>
    </div>
    <p id="last">Cancel Order</p>
  </div>

</body>
</html>

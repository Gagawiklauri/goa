<!DOCTYPE html>
<html>
<head>
    <title>სიები</title>
</head>
<body>

<h2>დალაგებული სია (Ordered List)</h2>
<ol>
    <li>პირველი</li>
    <li>მეორე</li>
    <li>მესამე</li>
</ol>

<h2>დაულაგებელი სია (Unordered List)</h2>
<ul>
    <li>ვაშლი</li>
    <li>მსხალი</li>
    <li>ბანანი</li>
</ul>

<!-- 
დალაგებული სია (ol) გამოიყენება მაშინ, როცა ელემენტებს აქვს თანმიმდევრობა 
(მაგალითად: ნაბიჯები, რეიტინგი, პროცესი).

დაულაგებელი სია (ul) გამოიყენება მაშინ, როცა ელემენტებს არ აქვს თანმიმდევრობა
(მაგალითად: პროდუქტების ჩამონათვალი, იდეები, ნივთები).
-->

</body>
</html>

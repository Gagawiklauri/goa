<!--<div> არის კონტეინერი თეგი ასერომ ვთქვად ცარიელი ყუთი-->

    <!-- table> არის HTML თეგი, რომელიც გამოიყენება ცხრილის შესაქმნელად. -->


    <!-- ცხრილის გაკეთება ასე ხდება:

1) ვქმნით <table> თეგს
2) ვამატებთ პირველ რიგს <tr>
3) შემდეგ რიგებში ვიყენებთ <td> მონაცემებისთვის
--> 


<!DOCTYPE html>
<html>

<head>
    <title>Scores Table</title>
</head>

<body>

        <tr>
            <th>სახელი</th>
            <th>ქულა</th>
        </tr>

        <tr>
            <td>Luka</td>

        </tr>

        <tr>
            <td>Anna</td>
            <td>85</td>
        </tr>

        <tr>
            <td>Giorgi</td>
            <td>98</td>
        </tr>

        <tr>
            <td>Mariam</td>
            <td>92</td>
        </tr>

    </table>

</body>

</html>

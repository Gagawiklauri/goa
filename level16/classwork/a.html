<!-- <div> თეგი არის კონტეინერი (ყუთი), რომელიც გამოიყენება ელემენტების დასაჯგუფებლად. -->

<!DOCTYPE html>
<html>

<head>
    <title>Div Example</title>

    <style>

        .box1 {
            background-color: lightblue;
            padding: 15px;
        }

        
        .box2 {
            background-color: lightpink;
            padding: 15px;
        }
    </style>

</head>

<body>


    <div class="box1">
        <p>პარაგრაფი 1</p>
        <p>პარაგრაფი 2</p>
        <p>პარაგრაფი 3</p>
    </div>

    <br>


    <div class="box2">
        <p>პარაგრაფი 4</p>
        <p>პარაგრაფი 5</p>
        <p>პარაგრაფი 6</p>
    </div>

</body>

</html>



<!DOCTYPE html>
<html>

<head>
    <title>Family Table</title>
</head>

<body>

    <h2>ოჯახის წევრები</h2>

    <table border="1">

        <tr>
            <th>სახელი</th>
            <th>ასაკი</th>
            <th>როლი</th>
        </tr>

        <tr>
            <td>Nino</td>
            <td>35</td>
            <td>დედა</td>
        </tr>

        <tr>
            <td>Giorgi</td>
            <td>40</td>
            <td>მამა</td>
        </tr>

        <tr>
            <td>Luka</td>
            <td>12</td>
            <td>შვილი</td>
        </tr>

    </table>

</body>

</html>

<!--
css-ს ვიყენებთ რომ საიტი გავსტილოთ
-->



<!DOCTYPE html>
<html>

<head>
    <title>CSS Example</title>

    <style>

        
        h1 {
            color: red;
        }

        
        body {
            background-color: lightyellow;
        }


        h1 {
            font-size: 50px;
        }

    
        h1 {
            text-align: center;
        }

    
        p {
            font-weight: bold;
        }

        
        p {
            border: 2px solid black;
        }

        
        p {
            padding: 10px;
        }

        
        p {
            margin: 20px;
        }

    </style>

</head>

<body>

    <h1>CSS საიტი</h1>

    <p>ეს არის პარაგრაფი, სადაც გამოყენებულია CSS სტილები</p>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
    <title>External CSS Site</title>

    <!-- external css დაკავშირება -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Welcome to My Site</h1>

    <p>ეს არის ტექსტი რომელიც გასტილულია external CSS-ით</p>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <title>Frontend Mentor | Results summary component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- 
  Your Result
  76
  of 100

  Great
  You scored higher than 65% of the people who have taken these tests.
  
  Summary

  Reaction
  80 / 100

  Memory
  92 / 100

  Verbal
  61 / 100

  Visual
  72 / 100

  Continue -->

  <div class="left-card">
   <h1>your Result</h1>
   <div id="wre">
    <h3>76 <br> <span>of 100</span></h3>
   </div>

   <h2>Great</h2>
  </div>


  <div class="right-card">
    
    <div id="main">
      <h3>summary</h3>
      <div id="for">
        <img src="./assets/images/icon-reaction.svg" id="img1">
        <h3 id="st">Reaction</h3>
        80/100
      </div>

      <div id="forea">
        <img src="./assets/images/icon-memory.svg" id="pic2">
        <h3>Memory</h3>
        92/100
      </div>

      <div id="fori">
        <img src="./assets/images/icon-verbal.svg" id="pic1">
        <h3>Verbal</h3>
        61/100
      </div>

      <div id="xuti">
        <img src="./assets/images/icon-visual.svg" id="imgg2">
        <h3>Visual</h3>
        73/100
      </div>
    </div>

    
    <button>continue</button>
  </div>
</body>

</html>
